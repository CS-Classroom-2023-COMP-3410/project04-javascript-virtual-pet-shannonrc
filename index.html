<!DOCTYPE html>
<html lang="en">
<head>
    <!-- basic set up -->
  <meta charset="utf-8"> 
  <!-- tab title -->
  <title>virtual pet</title> 

  <style>
    /* basic page style */
    body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; } 

    #pet {
        /* pet width */
      width: 150px; 
      /* pet height */
      height: 150px; 
      /* center pet */
      margin: 20px auto; 
      /* default pet color */
      background-color: pink; 
      /* rounded corners */
      border-radius: 20px; 
      /* face size */
      font-size: 60px; 
      /* center face vertically */
      line-height: 150px; 
      /* stop highlighting */
      user-select: none; 
    } /* end pet box */
    /* button spacing */
    button { margin: 6px; padding: 10px 14px; } 
    /* happy color */
    .happy { background-color: pink; } 
    /* hungry color */
    .hungry { background-color: orange; } 
    /* sleepy color */
    .sleepy { background-color: lightblue; } 
    /* mint?? vibe for feed */
    .fed { background-color: #b8f2d0; } 
    /* yellow gives fun and play */
    .played { background-color: #fff3a3; } 
  </style>
</head>
<!-- buttons -->
<body>
    <!-- pet display -->
  <div id="pet">^_^</div> 
   <!-- status text -->
  <p id="status">mood: happy | health: good</p>
    <!-- feed button -->
  <button id="feed-btn" type="button">feed</button> 
  <!-- play button -->
  <button id="play-btn" type="button">play</button> 
  <!-- sleep button -->
  <button id="sleep-btn" type="button">sleep</button> 
    <!-- get the script -->
  <script src="script.js"></script> 
</body>
</html>
